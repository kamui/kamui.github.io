<svg class="single__mark" viewBox="0 0 84 84" width="84" height="84" aria-hidden="true" focusable="false">
  {{- if eq . "retry" }}
  <g class="single__spin">
    <path d="M52.3 13.8A30 30 0 1 1 19 22.7" fill="none" stroke="currentColor" stroke-width="11"/>
    <path d="M29.3 10.5 27.7 32.6 7.8 15.9Z" fill="currentColor"/>
  </g>
  {{- else if eq . "bench" }}
  <path d="M6 14h72" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
  <g fill="currentColor">
    <rect class="single__bar" style="--i: 0" x="9" y="44" width="13" height="30"/>
    <rect class="single__bar" style="--i: 1" x="27" y="30" width="13" height="44"/>
    <rect class="single__bar" style="--i: 2" x="45" y="18" width="13" height="56"/>
    <rect class="single__bar" style="--i: 3" x="63" y="38" width="13" height="36"/>
    <rect x="4" y="74" width="76" height="5"/>
  </g>
  {{- end }}
</svg>
