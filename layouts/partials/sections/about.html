{{ $a := .Site.Data.homepage.about }}
<section class="track about" id="about" aria-labelledby="about-title">
  <div class="track__side">
    <h2 class="track__title" id="about-title">{{ $a.title }}</h2>
    <figure class="riso">
      <img
        src="{{ $a.image.x | relURL }}"
        srcset="{{ $a.image.x | relURL }} 1x, {{ $a.image._2x | relURL }} 2x"
        width="512" height="384"
        alt="{{ $a.image.alt }}"
        loading="lazy">
    </figure>
  </div>
  <div class="track__body">
    <div class="prose">
      {{ range $a.notes }}<p>{{ . }}</p>{{ end }}
    </div>
    <div class="now" id="now">
      <div class="now__head">
        <h3>{{ $a.now.title }}</h3>
        <p class="now__updated">Updated {{ $a.now.updated }}</p>
      </div>
      <ol class="now__list">
        {{ range $a.now.items }}<li>{{ . | markdownify }}</li>{{ end }}
      </ol>
    </div>
  </div>
</section>
